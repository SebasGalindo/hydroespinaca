services:
  # -----------------------------
  # Proyecto 1: Hardware
  # -----------------------------
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001" # WebSocket (opcional, útil para frontends JS)
    volumes:
      - ./deploy/mosquitto/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log

  sensor-service:
    build: ./hardware-project/sensor-service
    container_name: sensor-service
    ports:
      - "5001:8080"
    environment:
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${SENSOR_MQTT_CLIENT_ID}
      - MQTT__Username=${SENSOR_MQTT_USER}
      - MQTT__Password=${SENSOR_MQTT_PASS}
      - APIKEY__Key=${SENSOR_API_KEY}
      - ASPNETCORE_ENVIRONMENT=Development
