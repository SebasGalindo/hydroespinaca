  # catalog-service:
  #   build: ./software-project/catalog-service
  #   container_name: catalog-service
  #   env_file: ./software-project/catalog-service/.env
  #   ports:
  #     - "6005:80"

  # -----------------------------
  # Frontend
  # -----------------------------

  # Frontend for development (Vite dev server)
  frontend-dev:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: development
    container_name: frontend
    depends_on:
      - nginx-proxy
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    networks:
      - espinaca-net
    profiles:
      - development

  # Frontend for production (build static files)
  frontend-build:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: build
    container_name: frontend-build
    volumes:
      - frontend_build:/var/www/frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    profiles:
      - production
    command: sh -c "cp -r dist/* /var/www/frontend/ && echo 'Frontend build completed and copied to volume'"

volumes:
  mqtt_data: 
  mqtt_log:
  certbot_certs:
  certbot_www:
  nginx_logs:
  frontend_build:

networks:
  espinaca-net:
    driver: bridge