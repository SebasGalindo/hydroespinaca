services:
  # -----------------------------
  # Reverse Proxy (recibe tráfico de Cloudflare)
  # -----------------------------
  nginx-proxy:
    build:
      context: .
      dockerfile: deploy-artifacts/nginx/Dockerfile
    container_name: nginx-proxy
    restart: unless-stopped
    depends_on:
      bff-service:
        condition: service_healthy
    ports:
      - "80:80"   # HTTP from Cloudflare
      - "443:443" # HTTPS for Full Strict TLS
    volumes:
      - ./deploy-artifacts/nginx/nginx.conf.tpl:/etc/nginx/templates/nginx.conf.tpl:ro
      - ./deploy-artifacts/nginx/nginx-certbot.conf.tpl:/etc/nginx/templates/nginx-certbot.conf.tpl:ro
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/.env:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - API_SUBDOMAIN=${API_SUBDOMAIN:-api}
      - MQTT_SUBDOMAIN=${MQTT_SUBDOMAIN:-mqtt}
      - FRONTEND_SUBDOMAIN=${FRONTEND_SUBDOMAIN:-www}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CERTBOT_ONLY=${CERTBOT_ONLY:-false}
    # nginx starts independently and proxies to bff-service when ready
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  # -----------------------------
  # Certbot con DNS-01 (Cloudflare)
  # -----------------------------
  certbot:
    image: certbot/dns-cloudflare
    container_name: certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/app/.env:ro
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    entrypoint: "sh /scripts/check-certs.sh"
    networks:
      - espinaca-net
    profiles:
      - production

  # Certificate renewal service (runs every 12h with proper hooks)
  certbot-renew:
    image: certbot/dns-cloudflare
    container_name: certbot-renew
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./deploy-artifacts/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/mqtt/certs:/srv/mqtt/certs
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    command: sh -c "while :; do sleep 12h & wait \$\$!; certbot renew --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini --dns-cloudflare-propagation-seconds 60 --quiet --deploy-hook '/scripts/certbot-hooks.sh deploy'; done"
    networks:
      - espinaca-net
    profiles:
      - production
  
  # -----------------------------
  # Proyecto 1: Hardware
  # -----------------------------
  mqtt:
    build:
      context: .
      dockerfile: deploy-artifacts/mosquitto/Dockerfile
    container_name: mqtt
    restart: unless-stopped
    ports:
      # Production TLS ports (always exposed)
      - "8883:8883"   # External MQTT with TLS
      - "9002:9002"   # WebSocket with TLS
    volumes:
      - ./deploy-artifacts/mosquitto/config:/mosquitto/config
      - ./deploy-artifacts/scripts:/scripts:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
      - /srv/mqtt/certs:/etc/mosquitto/certs:ro
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - MQTT_SUBDOMAIN=${MQTT_SUBDOMAIN:-mqtt}
      - COMPOSE_PROFILE=${COMPOSE_PROFILE:-development}
      # MQTT users for pwfile autogeneration in development
      - SENSOR_MQTT_USER=${SENSOR_MQTT_USER}
      - SENSOR_MQTT_PASS=${SENSOR_MQTT_PASS}
      - ACTUATOR_MQTT_USER=${ACTUATOR_MQTT_USER}
      - ACTUATOR_MQTT_PASS=${ACTUATOR_MQTT_PASS}
      - FUZZY_MQTT_USER=${FUZZY_MQTT_USER}
      - FUZZY_MQTT_PASS=${FUZZY_MQTT_PASS}
      - ESP32_MQTT_USER=${ESP32_MQTT_USER}
      - ESP32_MQTT_PASS=${ESP32_MQTT_PASS}
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health check' | timeout 5 nc localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  sensor-service:
    build:
      context: .
      dockerfile: hardware-project/sensor-service/Dockerfile
    container_name: sensor-service
    expose:
      - "8080"
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${SENSOR_MQTT_CLIENT_ID}
      - MQTT__Username=${SENSOR_MQTT_USER}
      - MQTT__Password=${SENSOR_MQTT_PASS}
      - M2M__ClientId=${SENSOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${SENSOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - NotificationService__BaseUrl=${NOTIFICATION_SERVICE_URL}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  actuator-service:
    build:
      context: .
      dockerfile: hardware-project/actuator-service/Dockerfile
    container_name: actuator-service
    expose:
      - "8080"
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${ACTUATOR_MQTT_CLIENT_ID}
      - MQTT__Username=${ACTUATOR_MQTT_USER}
      - MQTT__Password=${ACTUATOR_MQTT_PASS}
      - M2M__ClientId=${ACTUATOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${ACTUATOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - SensorService__BaseUrl=${SENSOR_SERVICE_URL}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development
 

  # # -----------------------------
  # # Proyecto 2: Backend inteligente
  # # -----------------------------

  auth-service:
    build:
      context: .
      dockerfile: software-project/auth-service/Dockerfile
    container_name: auth-service
    expose:
      - "8080"
    volumes:
      - ./software-project/auth-service/Keys:/app/Keys
    environment:
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - Jwt__KeysDirectory=/app/Keys
      - Jwt__Issuer=${Jwt_Issuer}
      - Jwt__Audience=${Jwt_Audience}
      - Jwt__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Jwt__RefreshTokenExpiryDays=${Jwt_RefreshTokenExpiryDays}
      # M2M Configuration for auth-service to communicate with other services
      - M2M__ClientId=${AUTH_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${AUTH_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      # External Service URLs
      - NotificationService__BaseUrl=${NOTIFICATION_SERVICE_URL}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      # Password seed data
      - HYDRO_ADMIN_PASSWORD=${HYDRO_ADMIN_PASSWORD}
      - HYDRO_TEST_USER_PASSWORD=${HYDRO_TEST_USER_PASSWORD}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  bff-service:
    build:
      context: .
      dockerfile: software-project/bff-service/Dockerfile
    container_name: bff-service
    expose:
      - "8080"
    ports:
      - "8081:8080"
    depends_on:
      - auth-service
      - sensor-service
      - actuator-service
      - bi-service
      - fuzzy-service
      - weather-service
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - M2M__ClientId=${BFF_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${BFF_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__SessionIdHeader=${BFF_SESSION_ID_HEADER}
      - Sessions__CsrfTokenHeader=${BFF_CSRF_TOKEN_HEADER}
      - Sessions__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__RefreshTokenExpiryDays=${Jwt_RefreshTokenExpiryDays}
      - Services__SensorService__Url=${SENSOR_SERVICE_URL}
      - Services__ActuatorService__Url=${ACTUATOR_SERVICE_URL}
      - Services__AuthService__Url=${AUTH_SERVICE_URL}
      - Services__BiService__Url=${BI_SERVICE_URL}
      - Services__FuzzyService__Url=${FUZZY_SERVICE_URL}
      - Services__WeatherService__Url=http://weather-service:8080
      - Cookies__Secure=${BFF_COOKIE_SECURE}
      - Cookies__SameSite=${BFF_COOKIE_SAMESITE}
      - Cookies__Domain=${BFF_COOKIE_DOMAIN}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - VIRTUAL_HOST=api.hydroespinaca.online
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  notification-service:
    build:
      context: .
      dockerfile: software-project/notification-service/Dockerfile
    container_name: notification-service
    expose:
      - "8080"
    depends_on:
      - auth-service
    environment:
      # JWT Configuration
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      # MongoDB Configuration (notification-specific)
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      # M2M Configuration
      - M2M__ClientId=${NOTIFICATION_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${NOTIFICATION_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      # Email Configuration
      - EMAIL__FromEmail=${EMAIL_FROM_EMAIL}
      - EMAIL__FromName=${EMAIL_FROM_NAME}
      - EMAIL__Provider=${EMAIL_PROVIDER}
      # Resend Configuration
      - EMAIL__Resend__ApiBaseUrl=${RESEND_API_BASE_URL}
      - EMAIL__Resend__ApiKey=${RESEND_API_KEY}
      # SMTP Configuration
      - EMAIL__Smtp__Host=${SMTP_HOST}
      - EMAIL__Smtp__Port=${SMTP_PORT}
      - EMAIL__Smtp__UseStartTls=${SMTP_USE_STARTTLS}
      - EMAIL__Smtp__Username=${SMTP_USERNAME}
      - EMAIL__Smtp__Password=${SMTP_PASSWORD}
      # ASP.NET Environment
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  weather-service:
    build:
      context: .
      dockerfile: software-project/weather-service/Dockerfile
    container_name: weather-service
    expose:
      - "8080"
    ports:
      - "5030:8080"
    depends_on:
      - auth-service
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - ExternalApis__OpenWeather__BaseUrl=https://api.openweathermap.org/data/3.0
      - ExternalApis__OpenWeather__ApiKey=${OPENWEATHER_API_KEY}
      - ExternalApis__OpenWeather__Latitude=4.7002001
      - ExternalApis__OpenWeather__Longitude=-74.2385058
      - Weather__ForecastCacheMinutes=30
      - Weather__AlertEvaluationIntervalMinutes=30
      - Weather__AlertDeduplicationHours=6
      - Services__NotificationService__Url=http://notification-service:8080
      - M2M__ClientId=${WEATHER_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${WEATHER_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  bi-service:
    build:
      context: .
      dockerfile: software-project/bi-service/Dockerfile
    container_name: bi-service
    expose:
      - "8080"
    ports:
      - "5020:8080"
    depends_on:
      - auth-service
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - M2M__ClientId=${BI_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${BI_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  fuzzy-service:
    build:
      context: .
      dockerfile: software-project/fuzzy-service/Dockerfile
    container_name: fuzzy-service
    expose:
      - "8000"
    depends_on:
      - auth-service
      - mqtt
    environment:
      # JWT Configuration
      - JWT_ISSUER=${Jwt_Issuer}
      - JWT_AUDIENCE=${Jwt_Audience}
      - JWT_PUBLIC_KEY_PATH=/app/Keys/public.pem
      # MongoDB Configuration
      - MONGO_CONNECTION_STRING=${MONGO_CONNECTION_STRING}
      - MONGO_DATABASE=${MONGO_DATABASE}
      # M2M Configuration
      - M2M_CLIENT_ID=${FUZZY_SERVICE_CLIENT_ID}
      - M2M_CLIENT_SECRET=${FUZZY_SERVICE_CLIENT_SECRET}
      - M2M_AUTH_SERVICE_URL=${AUTH_SERVICE_INTERNAL_URL}
      - M2M_TOKEN_ENDPOINT=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M_TOKEN_CACHE_DURATION_MINUTES=${Jwt_AccessTokenExpiryMinutes}
      # MQTT Configuration
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_CLIENT_ID=${FUZZY_MQTT_CLIENT_ID}
      - MQTT_USERNAME=${FUZZY_MQTT_USER}
      - MQTT_PASSWORD=${FUZZY_MQTT_PASS}
      # External Service URLs
      - SENSOR_SERVICE_URL=${SENSOR_SERVICE_URL}
      - ACTUATOR_SERVICE_URL=${ACTUATOR_SERVICE_URL}
      # Python Environment
      - PYTHONPATH=/app
    volumes:
      - ./software-project/auth-service/Keys:/app/Keys:ro
    networks:
      - espinaca-net
    profiles:
      - production
      - development


  # -----------------------------
  # Frontend - Next.js Web App
  # -----------------------------

  # Unified web-app service (profile-based deployment)
  # Development: Turbopack dev server with HMR
  # Production: Optimized production build
  web-app:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: ${WEB_TARGET:-production}
    container_name: web-app
    depends_on:
      bff-service:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_ACCESS_TOKEN_EXPIRY_MINUTES=${Jwt_AccessTokenExpiryMinutes}
      - NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS=${Jwt_RefreshTokenExpiryDays}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - espinaca-net
    profiles:
      - production

  # Development version with volume mount for HMR
  web-app-dev:
    container_name: web-app-dev
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      target: development
    depends_on:
      bff-service:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "3000:3000" # Expose dev server on host for convenience
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_ACCESS_TOKEN_EXPIRY_MINUTES=${Jwt_AccessTokenExpiryMinutes}
      - NEXT_PUBLIC_REFRESH_TOKEN_EXPIRY_DAYS=${Jwt_RefreshTokenExpiryDays}
    volumes:
      # Bind mount: source code from host with live reload
      - .:/workspace:cached
      # Anonymous volumes: protect node_modules from being overwritten by bind mount
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
      - /workspace/packages/shared/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - espinaca-net
    profiles:
      - development

