services:
  # -----------------------------
  # Reverse Proxy (recibe tráfico de Cloudflare)
  # -----------------------------
  nginx-proxy:
    build:
      context: .
      dockerfile: deploy-artifacts/nginx/Dockerfile
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP from Cloudflare
      - "443:443" # HTTPS for Full Strict TLS
    volumes:
      - ./deploy-artifacts/nginx/nginx.conf.tpl:/etc/nginx/templates/nginx.conf.tpl:ro
      - ./deploy-artifacts/nginx/nginx-certbot.conf.tpl:/etc/nginx/templates/nginx-certbot.conf.tpl:ro
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/.env:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
      - frontend_build:/var/www/frontend:ro  # Mount built frontend files
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - API_SUBDOMAIN=${API_SUBDOMAIN:-api}
      - MQTT_SUBDOMAIN=${MQTT_SUBDOMAIN:-mqtt}
      - FRONTEND_SUBDOMAIN=${FRONTEND_SUBDOMAIN:-www}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CERTBOT_ONLY=${CERTBOT_ONLY:-false}
    # nginx starts independently and proxies to bff-service when ready
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  # -----------------------------
  # Certbot para MQTT TLS únicamente
  # -----------------------------
  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx-proxy
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/app/.env:ro
    entrypoint: "sh /scripts/check-certs.sh"
    networks:
      - espinaca-net
    profiles:
      - production

  # Certificate renewal service (runs every 12h with proper hooks)
  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./deploy-artifacts/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/mqtt/certs:/srv/mqtt/certs
    command: sh -c "while :; do sleep 12h & wait \$\$!; certbot renew --quiet --pre-hook '/scripts/certbot-hooks.sh pre' --deploy-hook '/scripts/certbot-hooks.sh deploy' --post-hook '/scripts/certbot-hooks.sh post'; done"
    networks:
      - espinaca-net
    profiles:
      - production
  # -----------------------------
  # Proyecto 1: Hardware
  # -----------------------------
  mqtt:
    build:
      context: .
      dockerfile: deploy-artifacts/mosquitto/Dockerfile
    container_name: mqtt
    restart: unless-stopped
    ports:
      # Production TLS ports (always exposed)
      - "8883:8883"   # External MQTT with TLS
      - "1883:1883"   # External MQTT without TLS
      - "9002:9002"   # WebSocket with TLS
    expose:
      # Internal development ports (Docker network only)
      - "1883"        # Internal MQTT (no encryption)
      - "9001"        # WebSocket (no TLS)
    volumes:
      - ./deploy-artifacts/mosquitto/config:/mosquitto/config
      - ./deploy-artifacts/scripts:/scripts:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
      - /srv/mqtt/certs:/etc/mosquitto/certs:ro
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - MQTT_SUBDOMAIN=${MQTT_SUBDOMAIN:-mqtt}
      - COMPOSE_PROFILE=${COMPOSE_PROFILE:-development}
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health check' | timeout 5 nc localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  sensor-service:
    build:
      context: .
      dockerfile: hardware-project/sensor-service/Dockerfile
    container_name: sensor-service
    expose:
      - "8080"
    ports:
      - "6001:8080"  # Expose for testing purposes, can be removed in production
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${SENSOR_MQTT_CLIENT_ID}
      - MQTT__Username=${SENSOR_MQTT_USER}
      - MQTT__Password=${SENSOR_MQTT_PASS}
      - M2M__ClientId=${SENSOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${SENSOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  actuator-service:
    build:
      context: .
      dockerfile: hardware-project/actuator-service/Dockerfile
    container_name: actuator-service
    expose:
      - "8080"
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${ACTUATOR_MQTT_CLIENT_ID}
      - MQTT__Username=${ACTUATOR_MQTT_USER}
      - MQTT__Password=${ACTUATOR_MQTT_PASS}
      - M2M__ClientId=${ACTUATOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${ACTUATOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - SensorService__BaseUrl=${SENSOR_SERVICE_URL}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development
 

  # # -----------------------------
  # # Proyecto 2: Backend inteligente
  # # -----------------------------

  auth-service:
    build:
      context: .
      dockerfile: software-project/auth-service/Dockerfile
    container_name: auth-service
    expose:
      - "8080"
    ports:
      - "5002:8080"  # Expose for testing purposes, can be removed in production
    volumes:
      - ./software-project/auth-service/Keys:/app/Keys
    environment:
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - Jwt__KeysDirectory=/app/Keys
      - Jwt__Issuer=${Jwt_Issuer}
      - Jwt__Audience=${Jwt_Audience}
      - Jwt__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development


  bff-service:
    build:
      context: .
      dockerfile: software-project/bff-service/Dockerfile
    container_name: bff-service
    expose:
      - "8080"
    depends_on:
      - auth-service
      - sensor-service
      - actuator-service
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - M2M__ClientId=${BFF_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${BFF_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__SessionIdHeader=${BFF_SESSION_ID_HEADER}
      - Sessions__CsrfTokenHeader=${BFF_CSRF_TOKEN_HEADER}
      - Sessions__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__RefreshTokenExpiryDays=${Jwt_RefreshTokenExpiryDays}
      - Services__SensorService__Url=${SENSOR_SERVICE_URL}
      - Services__ActuatorService__Url=${ACTUATOR_SERVICE_URL}
      - Services__AuthService__Url=${AUTH_SERVICE_URL}
      - Cookies__Secure=${BFF_COOKIE_SECURE}
      - Cookies__SameSite=${BFF_COOKIE_SAMESITE}
      - Cookies__Domain=${BFF_COOKIE_DOMAIN}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
      - VIRTUAL_HOST=api.hydroespinaca.online
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  notification-service:
    build:
      context: .
      dockerfile: software-project/notification-service/Dockerfile
    container_name: notification-service
    expose:
      - "8080"
    ports:
      - "6004:8080"  # Expose for testing purposes, can be removed in production
    depends_on:
      - auth-service
    environment:
      # JWT Configuration
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      # MongoDB Configuration (notification-specific)
      - MONGO__ConnectionString=${NOTIFICATION_MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      # M2M Configuration
      - M2M__ClientId=${NOTIFICATION_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${NOTIFICATION_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      # Email Configuration
      - EMAIL__FromEmail=${EMAIL_FROM_EMAIL}
      - EMAIL__FromName=${EMAIL_FROM_NAME}
      - EMAIL__Provider=${EMAIL_PROVIDER}
      # Resend Configuration
      - EMAIL__Resend__ApiBaseUrl=${RESEND_API_BASE_URL}
      - EMAIL__Resend__ApiKey=${RESEND_API_KEY}
      # SMTP Configuration
      - EMAIL__Smtp__Host=${SMTP_HOST}
      - EMAIL__Smtp__Port=${SMTP_PORT}
      - EMAIL__Smtp__UseStartTls=${SMTP_USE_STARTTLS}
      - EMAIL__Smtp__Username=${SMTP_USERNAME}
      - EMAIL__Smtp__Password=${SMTP_PASSWORD}
      # ASP.NET Environment
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT}
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  fuzzy-service:
    build:
      context: .
      dockerfile: software-project/fuzzy-service/Dockerfile
    container_name: fuzzy-service
    expose:
      - "8000"
    ports:
      - "6003:8000"  # Expose for testing purposes, can be removed in production
    depends_on:
      - auth-service
      - mqtt
    environment:
      # JWT Configuration
      - JWT_ISSUER=${Jwt_Issuer}
      - JWT_AUDIENCE=${Jwt_Audience}
      - JWT_PUBLIC_KEY_PATH=/app/Keys/public.pem
      # MongoDB Configuration
      - MONGO_CONNECTION_STRING=${FUZZY_MONGO_CONNECTION_STRING}
      - MONGO_DATABASE=${MONGO_DATABASE}
      # M2M Configuration
      - M2M_CLIENT_ID=${FUZZY_SERVICE_CLIENT_ID}
      - M2M_CLIENT_SECRET=${FUZZY_SERVICE_CLIENT_SECRET}
      - M2M_AUTH_SERVICE_URL=${AUTH_SERVICE_INTERNAL_URL}
      - M2M_TOKEN_ENDPOINT=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M_TOKEN_CACHE_DURATION_MINUTES=${Jwt_AccessTokenExpiryMinutes}
      # MQTT Configuration
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_CLIENT_ID=${FUZZY_MQTT_CLIENT_ID}
      - MQTT_USERNAME=${FUZZY_MQTT_USER}
      - MQTT_PASSWORD=${FUZZY_MQTT_PASS}
      # External Service URLs
      - SENSOR_SERVICE_URL=${SENSOR_SERVICE_URL}
      - ACTUATOR_SERVICE_URL=${ACTUATOR_SERVICE_URL}
      # Python Environment
      - PYTHONPATH=/app
    volumes:
      - ./software-project/auth-service/Keys:/app/Keys:ro
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  # catalog-service:
  #   build: ./software-project/catalog-service
  #   container_name: catalog-service
  #   env_file: ./software-project/catalog-service/.env
  #   ports:
  #     - "6005:80"

  # -----------------------------
  # Frontend
  # -----------------------------

  # Frontend for development (Vite dev server) - New Monorepo Web App
  frontend-dev:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: development
    container_name: frontend
    depends_on:
      - nginx-proxy
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=/api
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
    volumes:
      # Mount source code for hot reload in development
      - .:/workspace:cached
      - /workspace/node_modules
      - /workspace/apps/frontend/node_modules
      - /workspace/packages/shared-ui/node_modules
    networks:
      - espinaca-net
    profiles:
      - development

  # Frontend for production (build static files) - New Monorepo Web App
  frontend-build:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
      target: build
    container_name: frontend-build
    volumes:
      - frontend_build:/var/www/frontend
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    profiles:
      - production
    command: sh -c "cp -r /workspace/apps/frontend/dist/* /var/www/frontend/ && echo 'Frontend build completed and copied to volume'"

volumes:
  mqtt_data: 
  mqtt_log:
  certbot_certs:
  certbot_www:
  nginx_logs:
  frontend_build:

networks:
  espinaca-net:
    driver: bridge