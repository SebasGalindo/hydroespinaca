services:
  # -----------------------------
  # Reverse Proxy (recibe tráfico de Cloudflare)
  # -----------------------------
  nginx-proxy:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP from Cloudflare
      - "443:443" # HTTPS for Full Strict TLS
    volumes:
      - ./deploy-artifacts/nginx/nginx.conf.tpl:/etc/nginx/templates/nginx.conf.tpl:ro
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/.env:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
      - nginx_logs:/var/log/nginx
      - frontend_build:/var/www/frontend:ro  # Mount built frontend files
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - API_SUBDOMAIN=${API_SUBDOMAIN:-api}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CERTBOT_ONLY=${CERTBOT_ONLY:-false}
    command: sh -c "apk add --no-cache gettext && mkdir -p /var/www/certbot/.well-known/acme-challenge && chmod -R 755 /var/www/certbot && /scripts/generate-nginx-config.sh && nginx -g 'daemon off;'"
    # nginx starts independently and proxies to bff-service when ready
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  # -----------------------------
  # Certbot para MQTT TLS únicamente
  # -----------------------------
  certbot:
    image: certbot/certbot
    container_name: certbot
    depends_on:
      - nginx-proxy
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./deploy-artifacts/scripts:/scripts:ro
      - ./.env:/app/.env:ro
    entrypoint: "sh /scripts/check-certs.sh"
    networks:
      - espinaca-net
    profiles:
      - production

  # Certificate renewal service (runs every 12h with proper hooks)
  certbot-renew:
    image: certbot/certbot
    container_name: certbot-renew
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./deploy-artifacts/scripts:/scripts:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: sh -c "while :; do sleep 12h & wait \$\$!; certbot renew --quiet --pre-hook '/scripts/certbot-hooks.sh pre' --deploy-hook '/scripts/certbot-hooks.sh deploy' --post-hook '/scripts/certbot-hooks.sh post'; done"
    networks:
      - espinaca-net
    profiles:
      - production
  # -----------------------------
  # Proyecto 1: Hardware
  # -----------------------------
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    restart: unless-stopped
    ports:
      # Production TLS ports (always exposed)
      - "8883:8883"   # External MQTT with TLS
      - "9002:9002"   # WebSocket with TLS
    expose:
      # Internal development ports (Docker network only)
      - "1883"        # Internal MQTT (no encryption)
      - "9001"        # WebSocket (no TLS)
    volumes:
      - ./deploy-artifacts/mosquitto/config:/mosquitto/config
      - ./deploy-artifacts/scripts:/scripts:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
      - certbot_certs:/etc/letsencrypt:ro
    environment:
      - USE_TLS=${USE_TLS:-false}
      - ENVIRONMENT=${ENVIRONMENT:-Development}
      - DOMAIN=${DOMAIN}
      - MQTT_SUBDOMAIN=${MQTT_SUBDOMAIN:-mqtt}
      - COMPOSE_PROFILE=${COMPOSE_PROFILE:-development}
    entrypoint: sh -c "apk add --no-cache gettext netcat-openbsd && /scripts/startup-mosquitto.sh"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo 'health check' | timeout 5 nc localhost 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  sensor-service:
    build:
      context: .
      dockerfile: hardware-project/sensor-service/Dockerfile
    container_name: sensor-service
    expose:
      - "8080"
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${SENSOR_MQTT_CLIENT_ID}
      - MQTT__Username=${SENSOR_MQTT_USER}
      - MQTT__Password=${SENSOR_MQTT_PASS}
      - APIKEY__Key=${SENSOR_API_KEY}
      - M2M__ClientId=${SENSOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${SENSOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  actuator-service:
    build:
      context: .
      dockerfile: hardware-project/actuator-service/Dockerfile
    container_name: actuator-service
    expose:
      - "8080"
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - MQTT__Host=${MQTT_HOST}
      - MQTT__Port=${MQTT_PORT}
      - MQTT__ClientId=${ACTUATOR_MQTT_CLIENT_ID}
      - MQTT__Username=${ACTUATOR_MQTT_USER}
      - MQTT__Password=${ACTUATOR_MQTT_PASS}
      - APIKEY__Key=${ACTUATOR_API_KEY}
      - M2M__ClientId=${ACTUATOR_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${ACTUATOR_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - SensorService__BaseUrl=http://sensor-service:8080
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - espinaca-net
    profiles:
      - production
      - development
 

  # # -----------------------------
  # # Proyecto 2: Backend inteligente
  # # -----------------------------

  auth-service:
    build:
      context: .
      dockerfile: software-project/auth-service/Dockerfile
    container_name: auth-service
    expose:
      - "8080"
    volumes:
      - ./software-project/auth-service/Keys:/app/Keys
    environment:
      - MONGO__ConnectionString=${MONGO_CONNECTION_STRING}
      - MONGO__Database=${MONGO_DATABASE}
      - Jwt__KeysDirectory=/app/Keys
      - Jwt__Issuer=${Jwt_Issuer}
      - Jwt__Audience=${Jwt_Audience}
      - Jwt__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - espinaca-net
    profiles:
      - production
      - development


  bff-service:
    build:
      context: .
      dockerfile: software-project/bff-service/Dockerfile
    container_name: bff-service
    expose:
      - "8080"
    depends_on:
      - auth-service
      - sensor-service
      - actuator-service
    environment:
      - JWT__Issuer=${Jwt_Issuer}
      - JWT__Audience=${Jwt_Audience}
      - M2M__ClientId=${BFF_SERVICE_CLIENT_ID}
      - M2M__ClientSecret=${BFF_SERVICE_CLIENT_SECRET}
      - M2M__AuthServiceUrl=${AUTH_SERVICE_INTERNAL_URL}
      - M2M__TokenEndpoint=${AUTH_SERVICE_TOKEN_ENDPOINT}
      - M2M__TokenCacheDurationMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__SessionIdHeader=${BFF_SESSION_ID_HEADER}
      - Sessions__CsrfTokenHeader=${BFF_CSRF_TOKEN_HEADER}
      - Sessions__AccessTokenExpiryMinutes=${Jwt_AccessTokenExpiryMinutes}
      - Sessions__RefreshTokenExpiryDays=${Jwt_RefreshTokenExpiryDays}
      - Services__SensorService__Url=${SENSOR_SERVICE_URL}
      - Services__ActuatorService__Url=${ACTUATOR_SERVICE_URL}
      - Services__AuthService__Url=${AUTH_SERVICE_URL}
      - ASPNETCORE_ENVIRONMENT=Development
      - VIRTUAL_HOST=api.hydroespinaca.online
    networks:
      - espinaca-net
    profiles:
      - production
      - development

  # fuzzy-service:
  #   build: ./software-project/fuzzy-service
  #   container_name: fuzzy-service
  #   env_file: ./software-project/fuzzy-service/.env
