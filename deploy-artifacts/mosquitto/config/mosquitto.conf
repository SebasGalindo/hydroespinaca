# =================================================
# Mosquitto MQTT Broker Configuration Template
# HydroEspinaca Project - Dynamic Configuration
# =================================================

# General settings
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Connection logging
connection_messages true
log_timestamp true

# Global authentication settings
allow_anonymous false
password_file /mosquitto/config/pwfile
acl_file /mosquitto/config/acl

# =================================================
# LISTENERS CONFIGURATION
# =================================================

# Internal MQTT listener (no encryption - Docker network only)
listener 1883 0.0.0.0
protocol mqtt


# WebSocket listener (development - no TLS)
listener 9001 0.0.0.0
protocol websockets



# =================================================
# SECURITY SETTINGS
# =================================================

# Message settings
max_queued_messages 250
max_packet_size 1048576
max_inflight_messages 50

# Connection settings
max_connections 50
max_keepalive 600

# Client settings
persistent_client_expiration 1d